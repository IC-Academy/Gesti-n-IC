name: Deploy Gestión IC a GitHub Pages

# Se ejecuta automaticamente en cada push a main.
# Tambien puede lanzarse manualmente desde la pestaña Actions (workflow_dispatch).
on:
  push:
    branches: [main]
  workflow_dispatch: {}

# Permisos minimos necesarios para publicar en GitHub Pages con el flujo nativo
# (actions/deploy-pages). El repositorio debe tener configurado
# Settings -> Pages -> Source = "GitHub Actions".
permissions:
  contents: read
  pages: write
  id-token: write

# Evita despliegues concurrentes que puedan pisarse entre si; no cancela un
# despliegue ya en curso, solo encola el siguiente.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: Instalar y compilar (falla si el build falla)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout del repositorio
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Instalar dependencias
        run: npm ci

      - name: Compilar (npm run build)
        # Fase 1: demo sin backend. Solo requiere la ruta exacta de Pages.
        env:
          VITE_BASE_PATH: /Gesti-n-IC/
        run: npm run build

      - name: Preparar artefacto de Pages (carpeta dist)
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    name: Publicar en GitHub Pages
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Desplegar a GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
